[build]
  builder = "DOCKERFILE"
  # Dockerfile handles both frontend (npm build) and backend (go build) properly
  # No custom buildCommand needed - let Docker do the work
  # Optimize build performance
  watchPatterns = ["cmd/**/*.go", "internal/**/*.go", "src/**/*.tsx", "src/**/*.ts", "Dockerfile"]
  nixPacksConfigPath = "railway.toml"

[deploy]
  # Optimized deployment settings
  healthcheckPath = "/healthz"
  healthcheckTimeout = 60
  startupTimeout = 180
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 10

  # Force fresh build without Docker layer caching to fix stale frontend
  skipCache = true
  numReplicas = 1

# Phases setup not needed when using Dockerfile
# [phases.setup]
#   aptPkgs = ["php", "php-mysql"]
#   nixPkgs = ["nodejs", "npm"]
#   nodeVersion = "18"

[[services]]
  name = "web"
  internal_port = 8080
  protocol = "http"
  
  # Optimized for Supabase connection
  startup_timeout = 180
  auto_restart = true
  auto_stop_machines = false
  min_machines_running = 1

  [services.concurrency]
    type = "connections"
    hard_limit = 50  # Increased for 3000+ concurrent users
    soft_limit = 40  # Increased for better performance

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]