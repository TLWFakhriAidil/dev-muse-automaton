<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DevMuse Automaton</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        .dashboard-container {
            min-height: 100vh;
            padding: 2rem;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dashboard-title {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--netflix-white) 0%, var(--netflix-red) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-email {
            color: var(--netflix-light-gray);
            font-size: 0.9rem;
        }

        .btn-logout {
            background: linear-gradient(135deg, var(--netflix-red) 0%, #b00710 100%);
            color: var(--netflix-white);
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: linear-gradient(135deg, #ff0a16 0%, var(--netflix-red) 100%);
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: rgba(20, 20, 20, 0.8);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--netflix-red);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.2);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .stat-title {
            color: var(--netflix-light-gray);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            color: var(--netflix-gold);
        }

        .quick-actions {
            background: rgba(20, 20, 20, 0.8);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .quick-actions h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--netflix-gold);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .action-btn {
            background: rgba(51, 51, 51, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: var(--netflix-white);
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .action-btn:hover {
            border-color: var(--netflix-red);
            background: rgba(51, 51, 51, 0.9);
        }

        .welcome-message {
            background: linear-gradient(135deg, rgba(229, 9, 20, 0.1) 0%, rgba(255, 215, 0, 0.1) 100%);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .welcome-message h2 {
            color: var(--netflix-gold);
            margin-bottom: 0.5rem;
        }

        .welcome-message p {
            color: var(--netflix-light-gray);
        }
    </style>
</head>
<body>
    <div class="background-gradient"></div>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1 class="dashboard-title">Dashboard</h1>
            <div class="user-info">
                <span class="user-email" id="userEmail">Loading...</span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="welcome-message">
            <h2>Welcome to DevMuse Automaton!</h2>
            <p>Your chatbot automation platform is ready. Start by connecting a WhatsApp device or creating your first flow.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📱</div>
                <div class="stat-title">Connected Devices</div>
                <div class="stat-value" id="deviceCount">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">🔄</div>
                <div class="stat-title">Active Flows</div>
                <div class="stat-value" id="flowCount">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">💬</div>
                <div class="stat-title">Conversations Today</div>
                <div class="stat-value" id="conversationCount">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">🤖</div>
                <div class="stat-title">AI Messages Sent</div>
                <div class="stat-value" id="aiMessageCount">0</div>
            </div>
        </div>

        <div class="quick-actions">
            <h2>Quick Actions</h2>
            <div class="action-buttons">
                <button class="action-btn" onclick="alert('Device management coming soon!')">
                    📱 Add Device
                </button>
                <button class="action-btn" onclick="alert('Flow builder coming soon!')">
                    🔄 Create Flow
                </button>
                <button class="action-btn" onclick="alert('Analytics coming soon!')">
                    📊 View Analytics
                </button>
                <button class="action-btn" onclick="alert('Settings coming soon!')">
                    ⚙️ Settings
                </button>
            </div>
        </div>
    </div>

    <script>
        // Check authentication
        function checkAuth() {
            const token = localStorage.getItem('auth_token');
            const userEmail = localStorage.getItem('user_email');

            if (!token) {
                // Not logged in, redirect to login
                window.location.href = '/';
                return;
            }

            // Display user email
            if (userEmail) {
                document.getElementById('userEmail').textContent = userEmail;
            }

            // TODO: Load actual stats from API
            // For now, show placeholder data
            setTimeout(() => {
                document.getElementById('deviceCount').textContent = '0';
                document.getElementById('flowCount').textContent = '0';
                document.getElementById('conversationCount').textContent = '0';
                document.getElementById('aiMessageCount').textContent = '0';
            }, 500);
        }

        // Logout function
        function logout() {
            // Clear localStorage
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_id');
            localStorage.removeItem('user_email');

            // Redirect to login
            window.location.href = '/';
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
